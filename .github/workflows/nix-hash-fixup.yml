name: nix-hash-fixup
# Renovate bumps `version` in pkgs/zot.nix but cannot compute src.hash or
# vendorHash. This recomputes them on the Renovate branch and pushes the
# result, so the head commit argunix builds is a consistent one.
#
# Only this repository needs it: stack4ops/images has no fixed-output hashes.
on:
  pull_request

jobs:
  fixup:
    # Renovate branches only. A hand-written PR that gets the hashes wrong
    # should fail its build and be fixed by hand, not silently rewritten.
    if: startsWith(github.head_ref, 'renovate/')
    uses: stack4ops/renovate/.github/workflows/nix-hash-fixup.yml@c73d568a7fc40003a2ac4887e0b363a2611fdd10 # main
    with:
      # Flake package attributes. One per package in this repository; the
      # name follows packages.<system>.<attr>, so `zot`, not `zot-bin`.
      attributes: zot
    secrets:
      # contents:write on THIS repository. Deliberately not GITHUB_TOKEN:
      # pushes made with it trigger no webhooks, so argunix would never see
      # the new head and automerge would wait forever.
      token: ${{ secrets.RENOVATE_TOKEN }}
